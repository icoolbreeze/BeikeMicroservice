<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111814">
    <title>清水房核分</title>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/score-review.css">
    <script src="/score-review.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <p class="eyebrow">内部核分 · 不上公开页</p>
        <h1>清水房优质指数</h1>
        <p class="lede" id="runMeta">正在载入最新评分批次…</p>
      </header>
      <nav class="tabs" id="tabs" aria-label="核分组">
        <button type="button" data-group="top" class="is-active">最高分</button>
        <button type="button" data-group="bottom">最低分</button>
        <button type="button" data-group="extreme">待核极端</button>
        <button type="button" data-group="mid">高可信对照</button>
      </nav>
      <nav class="districts" id="districts" aria-label="行政区筛选，可多选"></nav>
      <nav class="extras" id="extras" aria-label="其它筛选">
        <button type="button" id="coverFilter" class="is-active">有封面</button>
      </nav>
      <p class="hint" id="groupHint">先看封面和月租：是不是真住房、租金有没有少写一个 0。</p>
      <p class="open-status" id="openStatus" role="status"></p>
      <section class="grid" id="grid" aria-live="polite"></section>
      <p class="empty" id="empty" hidden>这一组没有房源。</p>
    </div>
  </body>
</html>
