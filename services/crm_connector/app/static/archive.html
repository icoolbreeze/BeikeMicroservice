<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>房源归档看板</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141a2e;
      --panel-2: #171f36;
      --line: #243049;
      --line-strong: #33436b;
      --text: #e8edf7;
      --muted: #8b97b3;
      --faint: #5f6c8a;
      --ok: #3dd68c;
      --warn: #f5c15c;
      --bad: #ff6b7a;
      --accent: #6ea8fe;
      --bar: #1e2a44;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    a { color: var(--accent); }

    /* ---- header ---- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 20px 28px 14px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .head-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
    #clock { font-variant-numeric: tabular-nums; }
    .refresh-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .refresh-btn:hover { border-color: var(--accent); }
    .refresh-btn svg { width: 13px; height: 13px; }
    .refresh-btn.spinning svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main { padding: 0 28px 40px; }

    /* ---- tabs ---- */
    .tabs {
      display: inline-flex; gap: 4px; padding: 4px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; margin-bottom: 16px;
    }
    .tab {
      appearance: none; border: 0; cursor: pointer;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 7px 22px; border-radius: 7px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--line-strong); color: var(--text); }

    .board { display: grid; gap: 14px; }
    .board[hidden] { display: none; }

    /* ---- status chips ---- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); padding: 5px 13px;
      font-size: 13px; color: var(--text); white-space: nowrap;
    }
    .chip b { font-weight: 600; }
    .chip .dim { color: var(--muted); }
    .chip.ok    { border-color: rgba(61,214,140,.45);  background: rgba(61,214,140,.08); }
    .chip.warn  { border-color: rgba(245,193,92,.45);  background: rgba(245,193,92,.08); }
    .chip.bad   { border-color: rgba(255,107,122,.5);  background: rgba(255,107,122,.09); }
    .chip.muted { opacity: .75; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
    .dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(61,214,140,.5); }
      55%      { box-shadow: 0 0 0 6px rgba(61,214,140,0); }
    }

    /* ---- cards / grids ---- */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card > .label { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    .value {
      font-size: 26px; font-weight: 700; margin-top: 4px;
      font-variant-numeric: tabular-nums; line-height: 1.15;
    }
    .value.bad { color: var(--bad); }
    .value.warn { color: var(--warn); }
    .grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
    @media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }

    .meta { color: var(--muted); font-size: 13px; display: grid; gap: 7px; margin-top: 10px; }
    .meta b { color: var(--text); font-weight: 600; }
    .meta .abort { color: var(--bad); }

    .bar {
      height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden;
    }
    .bar > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      border-radius: 99px; transition: width .4s ease;
    }
    .bar-row { margin-top: 14px; }
    .bar-label { color: var(--muted); font-size: 12.5px; margin-top: 7px; font-variant-numeric: tabular-nums; }

    /* ---- table ---- */
    .card .table-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 6px;
    }
    .table-note { color: var(--faint); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); }
    tbody tr:last-child td { border-bottom: 0; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    td.num, th.num { text-align: right; }
    tbody tr:hover td { background: rgba(110,168,254,.04); }
    tr.current td { background: rgba(110,168,254,.08); }
    tr.current td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    .dist-id { color: var(--faint); font-size: 12px; margin-left: 5px; }
    td .bar { min-width: 90px; }
    .pct-text { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .empty { color: var(--muted); text-align: center; padding: 22px 0; }

    /* ---- banner ---- */
    .banner {
      border: 1px solid rgba(255,107,122,.45);
      background: rgba(255,107,122,.09);
      color: var(--bad); border-radius: 10px;
      padding: 9px 14px; font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>房源归档看板</h1>
      <div class="sub">租赁 / 买卖归档实时状态 · 每 15 秒自动刷新</div>
    </div>
    <div class="head-right">
      <span id="updated">尚未刷新</span>
      <span id="clock"></span>
      <button class="refresh-btn" id="refresh-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
        刷新
      </button>
    </div>
  </header>

  <main>
    <nav class="tabs" role="tablist">
      <button class="tab active" type="button" data-tab="rental" role="tab">租赁</button>
      <button class="tab" type="button" data-tab="sale" role="tab">买卖</button>
    </nav>

    <!-- ============ 租赁 ============ -->
    <section class="board" id="board-rental">
      <div class="banner" data-err hidden></div>
      <div class="chips">
        <span data-html="session"></span>
        <span data-html="thread"></span>
        <span data-html="window"></span>
        <span data-html="cap"></span>
      </div>
      <section class="kpis">
        <article class="card"><div class="label">已入库</div><div class="value" data-text="total"></div></article>
        <article class="card"><div class="label">已补详情</div><div class="value" data-text="complete"></div></article>
        <article class="card"><div class="label">待补详情</div><div class="value" data-text="pending"></div></article>
        <article class="card"><div class="label">跳过</div><div class="value" data-text="skipped"></div></article>
        <article class="card"><div class="label">失败</div><div class="value" data-val="failed"></div></article>
        <article class="card"><div class="label">今日请求</div><div class="value" data-text="request_count"></div></article>
        <article class="card"><div class="label">今日详情</div><div class="value" data-text="detail_count"></div></article>
      </section>
      <section class="grid2">
        <article class="card">
          <div class="label">当前进度</div>
          <div class="meta" data-html="now"></div>
          <div class="bar-row">
            <div class="bar"><span data-width="overall"></span></div>
            <div class="bar-label" data-text="overall-label"></div>
          </div>
        </article>
        <article class="card">
          <div class="label">本轮 / 窗口</div>
          <div class="meta" data-html="run"></div>
        </article>
      </section>
      <article class="card">
        <div class="table-head">
          <span class="label">分行政区</span>
          <span class="table-note">完成率 =（已补详情 + 跳过）/ 入库</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>区</th>
              <th class="num">入库</th>
              <th class="num">详情完成</th>
              <th class="num">待补</th>
              <th class="num">跳过</th>
              <th class="num">失败</th>
              <th>完成率</th>
            </tr>
          </thead>
          <tbody data-districts></tbody>
        </table>
      </article>
    </section>

    <!-- ============ 买卖 ============ -->
    <section class="board" id="board-sale" hidden>
      <div class="banner" data-err hidden></div>
      <div class="chips">
        <span data-html="session"></span>
        <span data-html="thread"></span>
        <span data-html="window"></span>
        <span data-html="cap"></span>
      </div>
      <section class="kpis">
        <article class="card"><div class="label">已入库</div><div class="value" data-text="total"></div></article>
        <article class="card"><div class="label">已补详情</div><div class="value" data-text="complete"></div></article>
        <article class="card"><div class="label">待补详情</div><div class="value" data-text="pending"></div></article>
        <article class="card"><div class="label">跳过</div><div class="value" data-text="skipped"></div></article>
        <article class="card"><div class="label">失败</div><div class="value" data-val="failed"></div></article>
        <article class="card"><div class="label">今日请求</div><div class="value" data-text="request_count"></div></article>
        <article class="card"><div class="label">今日详情</div><div class="value" data-text="detail_count"></div></article>
      </section>
      <section class="grid2">
        <article class="card">
          <div class="label">当前进度</div>
          <div class="meta" data-html="now"></div>
          <div class="bar-row">
            <div class="bar"><span data-width="overall"></span></div>
            <div class="bar-label" data-text="overall-label"></div>
          </div>
        </article>
        <article class="card">
          <div class="label">本轮 / 窗口</div>
          <div class="meta" data-html="run"></div>
        </article>
      </section>
      <article class="card">
        <div class="table-head">
          <span class="label">分行政区</span>
          <span class="table-note">完成率 =（已补详情 + 跳过）/ 入库</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>区</th>
              <th class="num">入库</th>
              <th class="num">详情完成</th>
              <th class="num">待补</th>
              <th class="num">跳过</th>
              <th class="num">失败</th>
              <th>完成率</th>
            </tr>
          </thead>
          <tbody data-districts></tbody>
        </table>
      </article>
    </section>
  </main>

  <script>
    const POLL_MS = 15000;

    const BOARDS = [
      { key: "rental", url: "/api/v1/archive/rental/status", band: "租金档" },
      { key: "sale",   url: "/api/v1/archive/sale/status",   band: "总价档（万元）" },
    ];

    const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
    const capLabel = (n) => (n > 0 ? fmt(n) : "不限制");

    function pct(part, whole) {
      if (!whole) return 0;
      return Math.max(0, Math.min(100, Math.round((part / whole) * 100)));
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function formatTs(value) {
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return (d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
        pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }

    function dot(color, pulse) {
      return '<span class="dot' + (pulse ? " pulse" : "") + '" style="color:var(--' + color + ')"></span>';
    }

    function loginLink() {
      return ' <a href="/login" style="text-decoration:none;font-weight:600">前往扫码登录 →</a>';
    }

    function sessionChip(s) {
      const state = s.connection_state;
      if (state === "ready")
        return '<span class="chip ok">' + dot("ok") + 'CRM 会话 <b>正常</b></span>';
      if (state === "expiring")
        return '<span class="chip warn">' + dot("warn") + 'CRM 会话 <b>即将过期</b></span>';
      if (state === "auth_required")
        return '<span class="chip bad">' + dot("bad") + '<b>需扫码</b>' + loginLink() + '</span>';
      return '<span class="chip warn">' + dot("warn") + 'CRM 会话 <b>' +
        (state || "未知") + "</b></span>";
    }

    function threadChip(s) {
      if (!s.enabled)
        return '<span class="chip muted">' + dot("faint") + '归档 <b>已停用</b></span>';
      if (s.running)
        return '<span class="chip ok">' + dot("ok", true) + '归档线程 <b>运行中</b></span>';
      if (s.within_window)
        return '<span class="chip warn">' + dot("warn") + '归档线程 <b>等待中</b></span>';
      return '<span class="chip muted">' + dot("faint") + '归档线程 <b>窗口外暂停</b></span>';
    }

    function windowChip(s) {
      const cls = s.within_window ? "ok" : "muted";
      const text = s.within_window ? "窗口内" : "窗口外";
      return '<span class="chip ' + cls + '">' + dot(s.within_window ? "ok" : "faint") +
        '运行窗口 <b>' + s.window_start + "–" + s.window_end + "</b> " +
        '<span class="dim">' + text + "</span></span>";
    }

    function nowHtml(s, bandLabel) {
      const c = s.cursor || {};
      const extra = c.extra_filters || {};
      const extraLabel = Object.keys(extra).length
        ? " · 附加 " + Object.entries(extra).map(([k, v]) => k + "=" + v).join(",")
        : "";
      const pendingUnits = c.pending_units_count
        ? " · 本区待切单元 <b>" + fmt(c.pending_units_count) + "</b>"
        : "";
      const crawled = s.districts || [];
      const knownOrdinal = crawled.findIndex((d) => d.district_id === c.district_id) + 1;
      const ordinal = knownOrdinal > 0 ? knownOrdinal : (c.district_index || 0) + 1;
      return [
        "当前区 <b>" + (c.district_name || "—") + "</b> " + (c.district_id || "") +
          "（共 " + crawled.length + " 区，游标 " + ordinal + "/" + crawled.length + "）",
        bandLabel + " <b>" + (c.price_band || "未切分") + "</b>" + extraLabel +
          " · 第 <b>" + (c.page || 1) + "</b> 页" + pendingUnits,
        "本页已见 <b>" + fmt(c.seen_count) + "</b> · 待补详情队列 <b>" +
          fmt(c.pending_detail_count) + "</b>",
        c.unit_total != null
          ? "本单元 CRM total <b>" + fmt(c.unit_total) + "</b>"
          : "本单元 CRM total 尚未探测",
      ].map((line) => "<div>" + line + "</div>").join("");
    }

    function runHtml(s) {
      const run = s.last_run;
      const runLine = run
        ? ("最近一轮 <b>#" + run.id + "</b> 状态 <b>" + run.status + "</b>" +
           (run.price_band ? " · " + run.price_band : "") +
           "<br>页 " + fmt(run.pages_done) + " · 见到 " + fmt(run.items_seen) +
           " · 请求 " + fmt(run.request_count) + " · 详情 " + fmt(run.detail_count) +
           "<br>开始 " + formatTs(run.started_at) +
           (run.finished_at ? " · 结束 " + formatTs(run.finished_at) : "") +
           (run.abort_reason ? '<br><span class="abort">中止原因：' + run.abort_reason + "</span>" : ""))
        : "还没有跑完的轮次";
      return [
        "上海日 <b>" + ((s.counters && s.counters.local_date) || "—") + "</b>",
        "日封顶 请求 <b>" + capLabel(s.daily_request_cap) + "</b> / 详情 <b>" +
          capLabel(s.daily_detail_cap) + "</b>",
        runLine,
      ].map((line) => "<div>" + line + "</div>").join("");
    }

    function districtsHtml(s) {
      const currentId = (s.cursor || {}).district_id;
      const rows = s.districts || [];
      if (!rows.length) {
        return '<tr><td colspan="7" class="empty">库里还没有房源</td></tr>';
      }
      return rows.map((d) => {
        const p = pct(d.complete + d.skipped, d.total);
        const current = d.district_id === currentId;
        return "<tr" + (current ? ' class="current"' : "") + ">" +
          "<td>" + d.district_name + '<span class="dist-id">' + d.district_id + "</span></td>" +
          "<td class='num'>" + fmt(d.total) + "</td>" +
          "<td class='num'>" + fmt(d.complete) + "</td>" +
          "<td class='num'>" + fmt(d.pending) + "</td>" +
          "<td class='num'>" + fmt(d.skipped) + "</td>" +
          "<td class='num'>" + (d.failed ? '<span style="color:var(--bad)">' + fmt(d.failed) + "</span>" : "0") + "</td>" +
          "<td><div class='bar'><span style='width:" + p + "%'></span></div>" +
          "<div class='pct-text'>" + p + "%</div></td>" +
          "</tr>";
      }).join("");
    }

    // The chip wrappers themselves carry data-html; their whole content is
    // rebuilt on each refresh, so setHtml keeps using the same hook element.
    function renderBoard(board, s) {
      const root = document.getElementById("board-" + board.key);
      const setHtml = (name, value) => {
        const el = root.querySelector("[data-html='" + name + "']");
        if (el) el.innerHTML = value;
      };
      const setText = (name, value) => {
        const el = root.querySelector("[data-text='" + name + "']");
        if (el) el.textContent = value;
      };

      root.querySelector("[data-err]").hidden = true;

      setHtml("session", sessionChip(s));
      setHtml("thread", threadChip(s));
      setHtml("window", windowChip(s));
      setHtml("cap", '<span class="chip muted"><span class="dim">日封顶</span> 请求 <b>' +
        capLabel(s.daily_request_cap) + "</b> <span class='dim'>/</span> 详情 <b>" +
        capLabel(s.daily_detail_cap) + "</b></span>");

      setText("total", fmt(s.listing_total));
      setText("complete", fmt(s.listing_complete));
      setText("pending", fmt(s.listing_pending));
      setText("skipped", fmt(s.listing_skipped));
      const failedEl = root.querySelector("[data-val='failed']");
      failedEl.textContent = fmt(s.listing_failed);
      failedEl.className = "value" + (s.listing_failed > 0 ? " bad" : "");
      setText("request_count", fmt(s.counters.request_count));
      setText("detail_count", fmt(s.counters.detail_count));

      setHtml("now", nowHtml(s, board.band));

      const localized = (s.listing_complete || 0) + (s.listing_skipped || 0);
      const overall = pct(localized, s.listing_total);
      root.querySelector("[data-width='overall']").style.width = overall + "%";
      setText("overall-label",
        "库内完成 " + fmt(localized) + " / " + fmt(s.listing_total) +
        "（" + overall + "%；完成含跳过的不支持类型）");

      setHtml("run", runHtml(s));
      root.querySelector("[data-districts]").innerHTML = districtsHtml(s);
    }

    function showBoardError(board, message) {
      const el = document.getElementById("board-" + board.key).querySelector("[data-err]");
      el.hidden = false;
      el.textContent = message;
    }

    const inflight = { rental: false, sale: false };

    async function refreshBoard(board) {
      if (inflight[board.key]) return;
      inflight[board.key] = true;
      try {
        const res = await fetch(board.url, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        renderBoard(board, await res.json());
        markUpdated();
      } catch (e) {
        showBoardError(board, "无法读取" + (board.key === "sale" ? "买卖" : "租赁") +
          "归档状态：接口超时或返回错误（" + e.message + "），将继续自动重试");
      } finally {
        inflight[board.key] = false;
      }
    }

    function refreshAll() {
      const btn = document.getElementById("refresh-btn");
      btn.classList.add("spinning");
      Promise.allSettled(BOARDS.map(refreshBoard)).finally(() => {
        btn.classList.remove("spinning");
      });
    }

    function markUpdated() {
      document.getElementById("updated").textContent =
        "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
    }

    // ---- tabs ----
    function activateTab(key, push) {
      document.querySelectorAll(".tab").forEach((t) =>
        t.classList.toggle("active", t.dataset.tab === key));
      document.getElementById("board-rental").hidden = key !== "rental";
      document.getElementById("board-sale").hidden = key !== "sale";
      if (push) history.replaceState(null, "", "#" + key);
    }

    document.querySelectorAll(".tab").forEach((t) => {
      t.addEventListener("click", () => activateTab(t.dataset.tab, true));
    });
    window.addEventListener("hashchange", () => {
      const key = location.hash === "#sale" ? "sale" : "rental";
      activateTab(key, false);
    });

    // ---- clock ----
    setInterval(() => {
      document.getElementById("clock").textContent =
        new Date().toLocaleString("zh-CN", { hour12: false });
    }, 1000);

    document.getElementById("refresh-btn").addEventListener("click", refreshAll);

    // Skip polling while the tab is hidden; refresh immediately when it comes back.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshAll();
    });

    activateTab(location.hash === "#sale" ? "sale" : "rental", false);
    refreshAll();
    setInterval(() => { if (!document.hidden) refreshAll(); }, POLL_MS);
  </script>
</body>
</html>
