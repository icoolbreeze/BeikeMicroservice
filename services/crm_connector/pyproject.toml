[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-connector"
version = "0.1.0"
description = "Personal CRM MCP Connector service scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "qrcode>=7.4",
    "qrcode-terminal>=0.8",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest", "httpx", "ruff", "mypy"]

[project.scripts]
crm-authd = "app.authd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
