[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-verification"
version = "0.1.0"
description = "房源信息验证微服务：上传证件 → 提取字段 → 蓉e办验证 → 生成查询验证图片"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pillow>=10.0",
    "requests>=2.31",
    "numpy>=1.26",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
