# 本地开发编排。store-media 已具备完整端口/环境/卷配置；
# property-verification 与 crm-connector 已有 Dockerfile，可按需补齐 env_file / 挂载。
# 投入生产前仍需完善 gateway 反向代理、统一令牌校验与可选的 postgres/redis 基础组件。
services:
  gateway:
    build: ./gateway
    # TODO: ports / env_file / depends_on / 服务发现配置

  property-verification:
    build: ./services/property_verification
    # TODO: 挂载 ./services/property_verification/storage 与 .env，配置 OPENROUTER_API_KEY 等

  store-media:
    build: ./services/store_media
    ports:
      - "${SM_PUBLIC_PORT:-8080}:8010"
    environment:
      SM_STORAGE_DIR: /app/storage
      SM_MAX_UPLOAD_MB: ${SM_MAX_UPLOAD_MB:-500}
      SM_SESSION_HOURS: ${SM_SESSION_HOURS:-12}
      SM_CORS_ORIGINS: ${SM_CORS_ORIGINS:-}
      SM_BOOTSTRAP_ADMIN_USERNAME: ${SM_BOOTSTRAP_ADMIN_USERNAME:-}
      SM_BOOTSTRAP_ADMIN_PASSWORD: ${SM_BOOTSTRAP_ADMIN_PASSWORD:-}
      SM_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${SM_BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
    volumes:
      - store-media-data:/app/storage

  workers:
    build: ./workers
    # TODO: 接入任务队列后启用

  # TODO: 按需补充 postgres / redis 等基础组件（当前不启用、不创建任何数据表）

volumes:
  store-media-data:
